<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>פסק דין - מסך המרצה</title>
<style>
  :root{
    --bg:#12100c; --panel:#1d1a14; --panel2:#272219; --line:#3a3226;
    --txt:#f2ece0; --dim:#a89b83; --accent:#c9a227; --accent2:#8c7853;
    --ok:#3f9c5a; --bad:#c0453f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);min-height:100vh;
       font-family:"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}

  header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);
         border-bottom:1px solid var(--line);flex:none}
  header .ttl{font-size:21px;font-weight:700;color:var(--accent);letter-spacing:1px}
  header .crumb{font-size:16px;color:var(--dim)}
  header .sp{flex:1}
  header .count{font-size:17px;background:var(--panel2);border:1px solid var(--line);
                border-radius:20px;padding:5px 15px;font-variant-numeric:tabular-nums}
  header .clock{font-size:30px;font-weight:700;min-width:60px;text-align:center;
                font-variant-numeric:tabular-nums;color:var(--accent)}
  header .clock.low{color:var(--bad)}

  main{flex:1;display:flex;flex-direction:column;padding:24px 32px;gap:18px;
       max-width:1500px;width:100%;margin:0 auto}

  .fileno{font-size:17px;color:var(--accent2);letter-spacing:1px}
  h1.case{font-size:44px;line-height:1.15;font-weight:700}
  .brief{background:var(--panel);border-inline-start:6px solid var(--accent2);border-radius:12px;
         padding:22px 26px;font-size:26px;line-height:1.6;color:#ded5c4}
  h2.q{font-size:36px;line-height:1.3;font-weight:700}
  .sub{font-size:19px;color:var(--dim);line-height:1.6}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opts.one{grid-template-columns:1fr}
  .opt{display:flex;gap:15px;align-items:flex-start;background:var(--panel);
       border:3px solid var(--line);border-radius:14px;padding:18px 20px;
       font-size:23px;line-height:1.4;font-weight:600}
  .opt .n{flex:none;width:40px;height:40px;border-radius:9px;background:var(--panel2);
          display:flex;align-items:center;justify-content:center;font-size:21px}
  .opt .tx{flex:1}
  .opt .tally{flex:none;font-size:19px;color:var(--dim);font-variant-numeric:tabular-nums;
              align-self:center;min-width:44px;text-align:center}
  .opt.right{border-color:var(--ok);background:rgba(63,156,90,.17)}
  .opt.right .n{background:var(--ok);color:#04160a}
  .opt.wrong{border-color:var(--bad);opacity:.55}

  .explain{background:var(--panel);border-inline-start:6px solid var(--accent);border-radius:12px;
           padding:20px 24px;font-size:23px;line-height:1.65;color:#e4dbc9}

  /* לוח תוצאות בעמודות */
  /* justify-content:center כדי שכיתה קטנה לא תיצמד לצד אחד של המסך */
  .bars{display:flex;align-items:stretch;justify-content:center;gap:11px;flex:1;
        min-height:240px;padding-top:14px;overflow-x:auto}
  .bar{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:74px;flex:1;
       max-width:132px}
  .bar .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  /* העמודה ממוקמת אבסולוטית בתוך אזור גדילה. גובה באחוזים על אלמנט
     רגיל לא נפתר כאן, כי לאב אין גובה מוגדר, והעמודות קורסות לקו דק. */
  .bar .track{flex:1;width:100%;position:relative;min-height:60px}
  .bar .col{position:absolute;left:0;right:0;bottom:0;border-radius:9px 9px 0 0;
            min-height:6px;transition:height .6s ease}
  .bar .nm{font-size:15px;text-align:center;line-height:1.25;word-break:break-word;
           max-width:100%;color:#ded5c4}
  .bar .delta{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;height:19px}
  .bar .delta.up{color:var(--ok)} .bar .delta.down{color:var(--bad)}

  /* לובי */
  .lobby{flex:1;display:grid;grid-template-columns:340px 1fr;gap:34px;align-items:center}
  #qr{background:#fff;padding:16px;border-radius:16px;display:inline-block}
  #qr canvas{display:block}
  .joinurl{font-size:18px;color:var(--accent);word-break:break-all;margin-top:12px;
           text-align:center;direction:ltr}
  .roster{display:flex;flex-wrap:wrap;gap:11px;align-content:flex-start;max-height:64vh;
          overflow-y:auto}
  .chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
        border-radius:26px;padding:9px 17px;font-size:20px}
  .chip .dot{width:15px;height:15px;border-radius:50%;flex:none}

  .awards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  .aw{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
      display:flex;gap:12px;align-items:center}
  .aw .ic{font-size:31px;flex:none}
  .aw .nm{font-size:20px;font-weight:700}
  .aw .ds{font-size:15px;color:var(--dim);line-height:1.35}
  .aw .pl{font-size:19px;font-weight:700;color:var(--accent)}

  footer{display:flex;gap:12px;padding:14px 32px;background:var(--panel);
         border-top:1px solid var(--line);flex:none;align-items:center}
  button{font-family:inherit;font-size:19px;font-weight:700;padding:14px 30px;border:none;
         border-radius:12px;background:var(--accent);color:#1c1503;cursor:pointer}
  button:disabled{opacity:.3;cursor:default}
  button.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  button.danger{color:var(--bad)}
  footer .sp{flex:1}
  footer .hintline{font-size:16px;color:var(--dim)}
  .hidden{display:none!important}
</style>
</head>
<body>

<header>
  <span class="ttl">פסק דין</span>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="count hidden" id="count"></span>
  <span class="clock hidden" id="clock"></span>
</header>

<main id="main"></main>

<footer>
  <button id="btnMain">פתיחת האולם</button>
  <button id="btnSkip" class="ghost hidden">לחשוף עכשיו</button>
  <span class="sp"></span>
  <span class="hintline" id="hint"></span>
  <button id="btnReset" class="ghost danger">איפוס עמוק</button>
</footer>

<script src="js/gameData.js"></script>
<script src="js/engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
"use strict";
const firebaseConfig = {
  apiKey: "AIzaSyCXjGyaPhTv8RL7-aKp-tZRuuq5VyAtrKo",
  databaseURL: "https://erez-psak-din-game-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "erez-psak-din-game",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const G = window.gameData, E = window.psakDin, M = G.meta;
const $ = (id) => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ------------------------------------------------------------------
// שלבי המשחק. לכל תיק חמישה שלבים, וכל שלב שנפתח נחשף לפני הבא.
// ------------------------------------------------------------------
const STEPS = ["brief","track","evidence","ruling","sanction"];

// זרע קבוע לכל המשחק, כך שסדר האפשרויות זהה בכל הריצות של אותו מפגש
// אבל שונה בין מפגשים. נשמר ב-localStorage של מסך המרצה בלבד.
const SEED_KEY = "psak-din:seed";
let SEED = Number(localStorage.getItem(SEED_KEY));
if(!SEED){ SEED = Date.now() % 2147483647; localStorage.setItem(SEED_KEY, SEED); }
function rndFor(kind, caseId){ return E.seededRandom(E.seedOf(kind+":"+caseId+":"+SEED)); }

let players = {}, cur = { state:"lobby" }, answers = {};
let ci = 0, si = 0;            // אינדקס תיק, אינדקס שלב
let live = null;               // מה שנשלח כרגע לשלטים, כולל התשובה הנכונה שנשארת כאן
let revealed = false, tId = null, revealing = false;

/* ---------------------- כתובת ההצטרפות + QR ---------------------- */
const joinUrl = location.href.replace(/index\.html.*$/,"").replace(/\/?$/,"/") + "play.html";

/* ---------------------- מאזינים ---------------------- */
db.ref("players").on("value", s => { players = s.val() || {}; paint(); });
db.ref("game").on("value", s => {
  cur = s.val() || { state:"lobby" };
  if(typeof cur.ci === "number") ci = cur.ci;
  if(typeof cur.si === "number") si = cur.si;
  // אם המרצה ריענן את הדף באמצע תיק, live אבד. בונים אותו מחדש מ-ci/si.
  // הזרע נשמר ב-localStorage ולכן סדר האפשרויות יוצא זהה למה שכבר על הטלפונים.
  if(!live && (cur.state === "question" || cur.state === "reveal")){
    live = buildStep(ci, si);
    revealed = cur.state === "reveal";
    if(cur.state === "question" && live.seconds && cur.prompt && cur.prompt.startedAt)
      startClock(cur.prompt.startedAt, live.seconds);
  }
  paint();
});
db.ref("answers").on("value", s => { answers = s.val() || {}; paint(); });

function plist(){ return Object.entries(players).map(([id,p]) => Object.assign({id}, p)); }
function curAnswers(){ return (live && answers[live.key]) || {}; }

/* ---------------------- בניית שלב ---------------------- */
function buildStep(caseIdx, stepIdx){
  const c = G.cases[caseIdx], step = STEPS[stepIdx];
  const key = "c" + caseIdx + "-" + step;

  if(step === "brief") return { key, step, c, kind:"brief" };

  if(step === "track"){
    const order = E.shuffled(G.tracks, rndFor("tracks", c.id)).items;
    return { key, step, c, kind:"multi", exact:0,
      q:"לאן התיק הזה הולך?",
      crumb:"תיק " + c.no + " · " + c.title + " · הכרעה 1",
      options: order.map(t => t.icon + " " + t.label),
      ids: order.map(t => t.id),
      correctIds: c.tracks,
      explanation: c.trackExplain,
      seconds: 0 };
  }
  if(step === "evidence"){
    const order = E.shuffled(c.evidence, rndFor("ev", c.id)).items;
    return { key, step, c, kind:"multi", exact:M.evidencePicks,
      q:"אילו שתי ראיות פותחים?",
      crumb:"תיק " + c.no + " · " + c.title + " · הכרעה 2",
      options: order.map(e => e.icon + " " + e.label),
      ids: order.map(e => e.id),
      cards: order,
      correctIds: order.filter(e => e.relevant).map(e => e.id),
      explanation: c.evidenceNote,
      seconds: 0 };
  }
  const src = step === "ruling" ? c.ruling : c.sanction;
  const sq = E.shuffleQuestion(src, rndFor(step, c.id));
  return { key, step, c, kind:"single",
    q: sq.q,
    crumb:"תיק " + c.no + " · " + c.title + " · " + (step==="ruling" ? "הכרעה 3 · פסיקה" : "הכרעה 3 · סנקציה"),
    options: sq.options, correct: sq.correct, explanation: sq.explanation,
    seconds: M.questionSeconds };
}

/* ---------------------- שידור לשלטים ---------------------- */
function pushStep(){
  live = buildStep(ci, si);
  revealed = false; revealing = false;
  if(live.kind === "brief"){
    db.ref("game").set({ state:"brief", ci, si });
    return;
  }
  const prompt = { key: live.key, q: live.q, crumb: live.crumb, options: live.options,
                   multi: live.kind === "multi" };
  if(live.exact) prompt.exact = live.exact;
  if(live.seconds){ prompt.seconds = live.seconds; prompt.startedAt = Date.now(); }
  // נשלח רק נוסח האפשרויות. שום שדה כאן אינו מסגיר איזו מהן נכונה.
  db.ref("game").set({ state:"question", ci, si, prompt });
  if(live.seconds) startClock(prompt.startedAt, live.seconds);
}

function startClock(startedAt, seconds){
  stopClock();
  $("clock").classList.remove("hidden","low");
  const tick = () => {
    const left = seconds - (Date.now() - startedAt)/1000;
    $("clock").textContent = Math.max(0, Math.ceil(left));
    $("clock").classList.toggle("low", left <= 5);
    if(left <= 0){ stopClock(); doReveal(); }
  };
  tick(); tId = setInterval(tick, 200);
}
function stopClock(){ if(tId){clearInterval(tId); tId=null;} $("clock").classList.add("hidden"); }

/* ---------------------- חשיפה וניקוד ---------------------- */
function doReveal(){
  if(revealed || revealing || !live || live.kind === "brief") return;
  revealing = true;
  stopClock();
  const a = curAnswers();
  const reveal = {}, updates = {};

  plist().forEach(p => {
    const ans = a[p.id];
    let ok = false, pts = 0;
    if(ans){
      if(live.kind === "single"){
        ok = ans.pick === live.correct;
        pts = E.timedPoints(M, ok, ans.ms || 0);
      } else if(live.step === "track"){
        const picked = (ans.picks||[]).map(i => live.ids[i]);
        ok = E.tracksMatch(picked, live.correctIds);
        pts = E.trackPoints(M, picked, live.correctIds);
      } else { // ראיות: נקודה לכל קלף לפי הרלוונטיות שלו
        const picked = (ans.picks||[]).map(i => live.ids[i]);
        pts = picked.reduce((s,id) => {
          const card = live.cards.find(x => x.id === id);
          return s + (card ? E.evidencePoints(M, card) : 0);
        }, 0);
        ok = picked.every(id => live.correctIds.includes(id)) && picked.length > 0;
      }
    }
    reveal[p.id] = { ok, pts };
    updates["players/" + p.id + "/score"] = (p.score || 0) + pts;
    updates["players/" + p.id + "/last"] = pts;
    if(ok) updates["players/" + p.id + "/streak"] = (p.streak || 0) + 1;
    else updates["players/" + p.id + "/streak"] = 0;
    if(ok) updates["players/" + p.id + "/correct"] = (p.correct || 0) + 1;
    updates["players/" + p.id + "/answered"] = (p.answered || 0) + (ans ? 1 : 0);
    if(live.step === "track" && ok) updates["players/" + p.id + "/tracksOk"] = (p.tracksOk || 0) + 1;
    if(live.step === "evidence") updates["players/" + p.id + "/relCards"] =
      (p.relCards || 0) + ((ans && ans.picks) ? ans.picks.map(i=>live.ids[i]).filter(id=>live.correctIds.includes(id)).length : 0);
    if(live.kind === "single" && ok && ans) updates["players/" + p.id + "/msSum"] = (p.msSum || 0) + (ans.ms||0);
    if(live.kind === "single" && ok) updates["players/" + p.id + "/timed"] = (p.timed || 0) + 1;
  });

  updates["game/state"] = "reveal";
  updates["game/reveal"] = reveal;
  db.ref().update(updates).then(()=>{ revealed = true; revealing = false; paint(); });
}

/* ---------------------- ניווט ---------------------- */
function advance(){
  const st = cur.state;
  if(st === "lobby"){ ci = 0; si = 0; pushStep(); return; }
  if(st === "brief"){ si = 1; pushStep(); return; }
  if(st === "question"){ doReveal(); return; }
  if(st === "reveal"){
    if(si < STEPS.length - 1){ si++; pushStep(); return; }
    db.ref("game").update({ state:"scores" });   // סוף תיק
    return;
  }
  if(st === "scores"){
    if(ci < G.cases.length - 1){ ci++; si = 0; pushStep(); }
    else db.ref("game").update({ state:"finished" });
    return;
  }
}

/* ---------------------- תארים ---------------------- */
function computeAwards(){
  const ps = plist();
  const sorted = [...ps].sort((a,b)=>(b.score||0)-(a.score||0));
  const metrics = {
    first:  p => p === sorted[0] ? 1 : null,
    second: p => p === sorted[1] ? 1 : null,
    third:  p => p === sorted[2] ? 1 : null,
    investigator: p => p.relCards || 0,
    router:       p => p.tracksOk || 0,
    fastest:      p => (p.timed ? -( (p.msSum||0) / p.timed ) : null),
    accurate:     p => (p.answered ? (p.correct||0) / p.answered : null),
    streak:       p => p.bestStreak || p.streak || 0,
    comeback:     p => null, steady: p => (p.correct||0) - 0.001*(p.answered||0),
    brave:        p => p.answered || 0,
    insurance:    p => null, measures: p => null, ethics: p => null,
  };
  return E.assignAwards(ps, G.awards, metrics);
}

/* ---------------------- ציור ---------------------- */
function paint(){
  const st = cur.state || "lobby";
  const main = $("main"), btn = $("btnMain"), skip = $("btnSkip");
  const n = plist().length;
  $("count").classList.toggle("hidden", st === "lobby" || st === "finished");
  skip.classList.add("hidden");

  if(st === "lobby"){
    $("crumb").textContent = "";
    $("count").classList.add("hidden");
    main.innerHTML =
      '<div class="lobby">' +
        '<div style="text-align:center"><div id="qr"></div>' +
          '<div class="joinurl">' + esc(joinUrl) + '</div></div>' +
        '<div><h2 class="q" style="margin-bottom:14px">' + (n ? n + " באולם" : "ממתינים לשופטים") + '</h2>' +
          '<p class="sub" style="margin-bottom:18px">סרקו את הקוד או הקלידו את הכתובת. עשרה תיקים, שלוש הכרעות בכל אחד.</p>' +
          '<div class="roster">' + plist().map(p =>
            '<span class="chip"><span class="dot" style="background:' + esc(p.color) + '"></span>' +
            esc(p.name) + '</span>').join("") + '</div></div>' +
      '</div>';
    const cv = document.createElement("canvas");
    $("qr").appendChild(cv);
    new QRious({ element: cv, value: joinUrl, size: 300, level: "M" });
    btn.textContent = n ? ("לפתוח את התיק הראשון (" + n + ")") : "ממתינים למצטרפים";
    btn.disabled = n === 0;
    $("hint").textContent = "הקוד נשאר על המסך, אפשר להצטרף גם באיחור";
    return;
  }

  const c = G.cases[ci];
  $("crumb").textContent = "תיק " + (ci+1) + " מתוך " + G.cases.length;

  if(st === "brief"){
    $("count").classList.add("hidden");
    main.innerHTML =
      '<div class="fileno">תיק ' + c.no + ' / ' + G.cases.length + '</div>' +
      '<h1 class="case">' + esc(c.title) + '</h1>' +
      '<div class="brief">' + esc(c.brief) + '</div>';
    btn.textContent = "להכרעה הראשונה"; btn.disabled = false;
    $("hint").textContent = "קראו את התיק בקול, ואז פתחו את הכרעת המסלול";
    return;
  }

  if(st === "question" && live){
    const a = curAnswers(), got = Object.keys(a).length;
    $("count").textContent = got + " / " + n + " הגישו";
    main.innerHTML =
      '<p class="sub">' + esc(live.crumb) + '</p>' +
      '<h2 class="q">' + esc(live.q) + '</h2>' +
      (live.exact ? '<p class="sub">בוחרים בדיוק ' + live.exact + '</p>' :
       live.kind === "multi" ? '<p class="sub">אפשר לסמן יותר מאחד</p>' : '') +
      '<div class="opts' + (live.options.length <= 2 ? " one" : "") + '">' +
        live.options.map((o,i) =>
          '<div class="opt"><span class="n">' + (i+1) + '</span><span class="tx">' +
          esc(o) + '</span></div>').join("") + '</div>';
    btn.textContent = "לחשוף"; btn.disabled = false;
    $("hint").textContent = got >= n && n > 0 ? "כולם הגישו" : "ממתינים להגשות";
    if(got >= n && n > 0 && !revealed) doReveal();
    return;
  }

  if(st === "reveal" && live){
    const a = curAnswers();
    const tally = live.options.map((_,i) => plist().filter(p => {
      const ans = a[p.id]; if(!ans) return false;
      return live.kind === "single" ? ans.pick === i : (ans.picks||[]).includes(i);
    }).length);
    const isRight = (i) => live.kind === "single" ? i === live.correct
                                                 : live.correctIds.includes(live.ids[i]);
    $("count").textContent = Object.keys(a).length + " / " + n + " הגישו";
    main.innerHTML =
      '<p class="sub">' + esc(live.crumb) + '</p>' +
      '<h2 class="q">' + esc(live.q) + '</h2>' +
      '<div class="opts' + (live.options.length <= 2 ? " one" : "") + '">' +
        live.options.map((o,i) =>
          '<div class="opt ' + (isRight(i) ? "right" : "wrong") + '">' +
          '<span class="n">' + (i+1) + '</span><span class="tx">' + esc(o) + '</span>' +
          '<span class="tally">' + tally[i] + '</span></div>').join("") + '</div>' +
      '<div class="explain">' + esc(live.explanation) + '</div>';
    btn.textContent = si < STEPS.length - 1 ? "להכרעה הבאה" : "ללוח התוצאות";
    btn.disabled = false;
    $("hint").textContent = "המספר בצד הוא כמה סימנו כל אפשרות";
    return;
  }

  if(st === "scores" || st === "finished"){
    const ps = plist().sort((a,b)=>(b.score||0)-(a.score||0));
    const max = Math.max(1, ...ps.map(p=>p.score||0));
    $("count").textContent = ps.length + " שופטים";
    let html =
      '<h2 class="q">' + (st === "finished" ? "בית המשפט קם" : "אחרי תיק " + c.no) + '</h2>' +
      '<div class="bars">' + ps.map(p => {
        // ניקוד שלילי אפשרי בהחלט בתחילת המשחק, ולכן מקבעים ל-0 ולא לשלילי
        const h = Math.max(0, Math.min(100, Math.round((p.score||0) / max * 100)));
        const d = p.last || 0;
        return '<div class="bar">' +
          '<span class="delta ' + (d>0?"up":d<0?"down":"") + '">' + (d>0?"+"+d:d||"") + '</span>' +
          '<span class="v">' + (p.score||0) + '</span>' +
          '<span class="track"><span class="col" style="height:' + h + '%;background:' +
            esc(p.color) + '"></span></span>' +
          '<span class="nm">' + esc(p.name) + '</span></div>';
      }).join("") + '</div>';
    if(st === "finished"){
      const aw = computeAwards();
      if(aw.length) html += '<div class="awards">' + aw.map(x =>
        '<div class="aw"><span class="ic">' + x.award.icon + '</span><span>' +
        '<span class="nm">' + esc(x.award.title) + '</span><br>' +
        '<span class="pl">' + esc(x.player.name) + '</span>' +
        (x.award.desc ? '<br><span class="ds">' + esc(x.award.desc) + '</span>' : '') +
        '</span></div>').join("") + '</div>';
    }
    main.innerHTML = html;
    btn.textContent = st === "finished" ? "המשחק הסתיים" :
                      (ci < G.cases.length-1 ? "לתיק הבא" : "לסיום");
    btn.disabled = st === "finished";
    $("hint").textContent = st === "finished"
      ? 'לפני כיתה הבאה, הריצו "איפוס עמוק"'
      : "העמודות מסודרות לפי הניקוד";
    return;
  }

  main.innerHTML = '<p class="sub">רגע</p>';
}

/* ---------------------- כפתורים ---------------------- */
$("btnMain").onclick = advance;
$("btnReset").onclick = () => {
  if(!confirm("איפוס עמוק ימחק את כל השחקנים ואת כל הניקוד של הכיתה הנוכחית. להמשיך?")) return;
  stopClock(); live = null; ci = 0; si = 0;
  localStorage.removeItem(SEED_KEY);
  db.ref().set({ game: { state:"lobby" } });
};

console.log("[index] מסך המרצה מוכן, " + G.cases.length + " תיקים");
</script>
